name: Daily sync

on:
  schedule:
    - cron: '0 0 * * *'  # 00:00 UTC = 03:00 МСК
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync all (staff, services, transactions)
        run: curl -f "https://insalon.onrender.com/sync/all"
      - name: Wait for background tasks
        run: sleep 30
      - name: Sync records (last 45 days)
        run: curl -f "https://insalon.onrender.com/sync/records"
