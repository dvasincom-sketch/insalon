<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insalon — Аналитика</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background: #f4f6f9; font-family: -apple-system, sans-serif; }
        .navbar { background: #1a1a2e; }
        .navbar-brand { color: white !important; font-weight: 700; font-size: 1.3rem; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .kpi-card { border-left: 4px solid; }
        .kpi-card.revenue { border-color: #2ecc71; }
        .kpi-card.visits { border-color: #3498db; }
        .kpi-card.clients { border-color: #9b59b6; }
        .kpi-card.churn { border-color: #e74c3c; }
        .kpi-value { font-size: 1.8rem; font-weight: 700; }
        .kpi-label { color: #6c757d; font-size: 0.85rem; }
        .growth-positive { color: #2ecc71; }
        .growth-negative { color: #e74c3c; }
        .section-title { font-weight: 600; color: #1a1a2e; margin-bottom: 1rem; }
        .churn-badge { background: #fff3f3; color: #e74c3c; padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; }
        .loading { text-align: center; padding: 40px; color: #6c757d; }
    </style>
</head>
<body>
 
<nav class="navbar px-4 py-3 mb-4">
    <span class="navbar-brand">✨ Insalon</span>
    <span class="text-white opacity-50" id="last-updated"></span>
</nav>
 
<div class="container-fluid px-4">
 
    <!-- KPI карточки -->
    <div class="row g-3 mb-4" id="kpi-row">
        <div class="col-12 loading">Загружаем данные...</div>
    </div>
 
    <!-- Графики -->
    <div class="row g-3 mb-4">
        <div class="col-lg-8">
            <div class="card p-4">
                <h6 class="section-title">Выручка по неделям</h6>
                <canvas id="revenueChart" height="100"></canvas>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="card p-4">
                <h6 class="section-title">Новые vs Повторные</h6>
                <canvas id="clientsChart" height="200"></canvas>
            </div>
        </div>
    </div>
 
    <!-- Топ услуги и отток -->
    <div class="row g-3 mb-4">
        <div class="col-lg-6">
            <div class="card p-4">
                <h6 class="section-title">Топ услуги по выручке</h6>
                <div id="services-list" class="loading">Загружаем...</div>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="card p-4">
                <h6 class="section-title">
                    Риск оттока
                    <span class="churn-badge" id="churn-count"></span>
                </h6>
                <div id="churn-list" class="loading">Загружаем...</div>
            </div>
        </div>
    </div>
 
    <!-- P&L отчёт -->
    <div class="row g-3 mb-4">
        <div class="col-12">
            <div class="card p-4">
                <h6 class="section-title">P&L по месяцам</h6>
                <div class="table-responsive">
                    <table class="table table-sm table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>Месяц</th>
                                <th class="text-end">Выручка</th>
                                <th class="text-end">Fitmost</th>
                                <th class="text-end">Итого доходы</th>
                                <th class="text-end">Зарплата</th>
                                <th class="text-end">Аренда</th>
                                <th class="text-end">Материалы</th>
                                <th class="text-end">Маркетинг</th>
                                <th class="text-end">Банк</th>
                                <th class="text-end">Прочее</th>
                                <th class="text-end">Расходы</th>
                                <th class="text-end">Прибыль</th>
                            </tr>
                        </thead>
                        <tbody id="pl-body">
                            <tr><td colspan="11" class="text-center text-muted">Загружаем...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
 
</div>
 
<script>
const API = '';
 
async function fetchData(url) {
    const res = await fetch(API + url);
    return res.json();
}
 
function formatMoney(n) {
    return new Intl.NumberFormat('ru-RU', {style: 'currency', currency: 'RUB', maximumFractionDigits: 0}).format(n);
}
 
function formatDate(dateStr) {
    return new Date(dateStr).toLocaleDateString('ru-RU', {day: 'numeric', month: 'short'});
}
 
async function loadKPI() {
    const data = await fetchData('/analytics/summary');
    const growth = data.revenue_growth;
    const growthClass = growth >= 0 ? 'growth-positive' : 'growth-negative';
    const growthSign = growth >= 0 ? '+' : '';
 
    document.getElementById('kpi-row').innerHTML = `
        <div class="col-sm-6 col-xl-3">
            <div class="card p-3 kpi-card revenue">
                <div class="kpi-label">Выручка за месяц</div>
                <div class="kpi-value">${formatMoney(data.current_month_revenue)}</div>
                <div class="${growthClass}">${growthSign}${growth}% vs прошлый месяц</div>
            </div>
        </div>
        <div class="col-sm-6 col-xl-3">
            <div class="card p-3 kpi-card visits">
                <div class="kpi-label">Визитов за месяц</div>
                <div class="kpi-value">${data.current_month_visits}</div>
                <div class="text-muted">подтверждённых визитов</div>
            </div>
        </div>
        <div class="col-sm-6 col-xl-3">
            <div class="card p-3 kpi-card clients">
                <div class="kpi-label">Уникальных клиентов</div>
                <div class="kpi-value">${data.unique_clients}</div>
                <div class="text-muted">в этом месяце</div>
            </div>
        </div>
        <div class="col-sm-6 col-xl-3">
            <div class="card p-3 kpi-card churn">
                <div class="kpi-label">Прошлый месяц</div>
                <div class="kpi-value">${formatMoney(data.prev_month_revenue)}</div>
                <div class="text-muted">для сравнения</div>
            </div>
        </div>
    `;
}
 
async function loadRevenueChart() {
    const data = await fetchData('/analytics/revenue?weeks=12');
    new Chart(document.getElementById('revenueChart'), {
        type: 'line',
        data: {
            labels: data.labels.map(formatDate),
            datasets: [{
                label: 'Выручка',
                data: data.revenue,
                borderColor: '#2ecc71',
                backgroundColor: 'rgba(46,204,113,0.1)',
                fill: true,
                tension: 0.4,
                pointRadius: 4
            }]
        },
        options: {
            plugins: { legend: { display: false } },
            scales: {
                y: { ticks: { callback: v => formatMoney(v) } }
            }
        }
    });
}
 
async function loadClientsChart() {
    const data = await fetchData('/analytics/clients?weeks=12');
    new Chart(document.getElementById('clientsChart'), {
        type: 'bar',
        data: {
            labels: data.labels.map(formatDate),
            datasets: [
                {
                    label: 'Новые',
                    data: data.new,
                    backgroundColor: '#3498db'
                },
                {
                    label: 'Повторные',
                    data: data.returning,
                    backgroundColor: '#2ecc71'
                }
            ]
        },
        options: {
            scales: { x: { stacked: true }, y: { stacked: true } }
        }
    });
}
 
async function loadServices() {
    const data = await fetchData('/analytics/services');
    const html = data.services.map((s, i) => `
        <div class="d-flex justify-content-between align-items-center py-2 ${i < data.services.length-1 ? 'border-bottom' : ''}">
            <div>
                <div class="fw-500">${s.title}</div>
                <small class="text-muted">${s.count} визитов · ср. чек ${formatMoney(s.avg_check)}</small>
            </div>
            <div class="fw-bold">${formatMoney(s.revenue)}</div>
        </div>
    `).join('');
    document.getElementById('services-list').innerHTML = html;
}
 
async function loadChurn() {
    const data = await fetchData('/analytics/churn?days=45');
    document.getElementById('churn-count').textContent = data.count + ' клиентов';
 
    if (data.clients.length === 0) {
        document.getElementById('churn-list').innerHTML = '<p class="text-success">Нет клиентов под риском оттока 🎉</p>';
        return;
    }
 
    const html = data.clients.slice(0, 8).map(c => `
        <div class="d-flex justify-content-between align-items-center py-2 border-bottom">
            <div>
                <div>${c.name || 'Без имени'}</div>
                <small class="text-muted">${c.phone || ''}</small>
            </div>
            <small class="text-danger">был ${formatDate(c.last_visit)}</small>
        </div>
    `).join('');
    document.getElementById('churn-list').innerHTML = html;
}
 
async function loadPL() {
    const data = await fetchData('/analytics/pl');
    if (!data.months) return;
 
    const html = [...data.months].reverse().map(m => {
        const profitClass = m.profit >= 0 ? 'text-success fw-bold' : 'text-danger fw-bold';
        return `
        <tr>
            <td>${m.month}</td>
            <td class="text-end">${formatMoney(m.revenue_direct)}</td>
            <td class="text-end">${formatMoney(m.revenue_fitmost)}</td>
            <td class="text-end fw-bold">${formatMoney(m.total_revenue)}</td>
            <td class="text-end text-danger">${formatMoney(m.salary)}</td>
            <td class="text-end text-danger">${formatMoney(m.rent)}</td>
            <td class="text-end text-danger">${formatMoney(m.materials)}</td>
            <td class="text-end text-danger">${formatMoney(m.marketing)}</td>
            <td class="text-end text-danger">${formatMoney(m.bank_fees)}</td>
            <td class="text-end text-danger">${formatMoney(m.other)}</td>
            <td class="text-end text-danger">${formatMoney(m.total_expenses)}</td>
            <td class="text-end ${profitClass}">${formatMoney(m.profit)}</td>
        </tr>`;
    }).join('');
 
    document.getElementById('pl-body').innerHTML = html;
}
 
async function init() {
    document.getElementById('last-updated').textContent =
        'Обновлено: ' + new Date().toLocaleTimeString('ru-RU');
 
    await Promise.all([
        loadKPI(),
        loadRevenueChart(),
        loadClientsChart(),
        loadServices(),
        loadChurn(),
        loadPL()
    ]);
}
 
init();
</script>
</body>
</html>
